name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper is version 9.3.1
        run: |
          find . -name "gradle-wrapper.properties" | while read wfile; do
            sed -i 's/gradle-[0-9.]\+-bin.zip/gradle-9.3.1-bin.zip/g' "$wfile"
            echo "Updated $wfile to Gradle 9.3.1"
          done

      - name: Ensure google-services.json exists
        run: |
          find . -name "app" -type d | while read appdir; do
            if [ ! -f "$appdir/google-services.json" ]; then
              echo "Creating fallback google-services.json in $appdir"
              cat << 'EOF' > "$appdir/google-services.json"
          {
            "project_info": {
              "project_number": "255738614645",
              "firebase_url": "https://daily-expenses-management-default-rtdb.firebaseio.com",
              "project_id": "daily-expenses-management",
              "storage_bucket": "daily-expenses-management.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:255738614645:android:6a8e25ac0167507a87393c",
                  "android_client_info": {
                    "package_name": "com.arun.dailyexpensesmanagement"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "255738614645-99pu1m6bjd7ic910m7mg9ng0cmmdbe5g.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.arun.dailyexpensesmanagement",
                      "certificate_hash": "162aafff8063f3eb8ec139302aceac8131347093"
                    }
                  },
                  {
                    "client_id": "255738614645-j1reg4tppdfs3h61thoi6i4vf8kd9sjr.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAadqENfexwKGOy5v8iu-f57hMb2iMKl68"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "255738614645-j1reg4tppdfs3h61thoi6i4vf8kd9sjr.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          done

      - name: Ensure Debug Keystore exists
        run: |
          # Decode debug.keystore.base64 if present
          find . -name "debug.keystore.base64" | while read kfile; do
            kdir=$(dirname "$kfile")
            base64 -d "$kfile" > "$kdir/debug.keystore" || true
          done

          # Automatically generate debug.keystore in all project root folders if not present
          find . -name "settings.gradle.kts" -not -path "*/build/*" | while read sfile; do
            pdir=$(dirname "$sfile")
            if [ ! -f "$pdir/debug.keystore" ]; then
              echo "Generating debug.keystore in $pdir"
              keytool -genkey -v -keystore "$pdir/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          done

          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore "debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Release Keystore exists
        run: |
          find . -name "settings.gradle.kts" -not -path "*/build/*" | while read sfile; do
            pdir=$(dirname "$sfile")
            if [ ! -f "$pdir/my-upload-key.jks" ]; then
              echo "Generating my-upload-key.jks in $pdir"
              keytool -genkey -v -keystore "$pdir/my-upload-key.jks" -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=ExpenseManager, OU=Mobile, O=AIStudio, L=City, S=State, C=IN"
            fi
          done

      - name: Build Release APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          # Find directory containing settings.gradle.kts (handles root or nested folders)
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -not -path "*/build/*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Building project in directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseManager-release-apk
          path: "**/app/build/outputs/apk/release/*.apk"
          retention-days: 14
