name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure google-services.json exists
        run: |
          find . -name "app" -type d | while read appdir; do
            if [ ! -f "$appdir/google-services.json" ]; then
              echo "Creating fallback google-services.json in $appdir"
              cat << 'EOF' > "$appdir/google-services.json"
          {
            "project_info": {
              "project_number": "295324687593",
              "firebase_url": "https://expense-trecker-default-rtdb.firebaseio.com",
              "project_id": "expense-trecker",
              "storage_bucket": "expense-trecker.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:295324687593:android:e1b5dcd3fba7e5dd416478",
                  "android_client_info": {
                    "package_name": "com.my.expensemanager"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "295324687593-8pscae0itb9282n02e4l3j6kieg9ungs.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAmrnrzUStkDscWbHkjxjPslu_u_Rf7oJE"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "295324687593-8pscae0itb9282n02e4l3j6kieg9ungs.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          done

      - name: Ensure Debug Keystore exists
        run: |
          # Decode debug.keystore.base64 if present
          find . -name "debug.keystore.base64" | while read kfile; do
            kdir=$(dirname "$kfile")
            base64 -d "$kfile" > "$kdir/debug.keystore" || true
          done

          # Automatically generate debug.keystore in all project root folders if not present
          find . -name "settings.gradle.kts" -not -path "*/build/*" | while read sfile; do
            pdir=$(dirname "$sfile")
            if [ ! -f "$pdir/debug.keystore" ]; then
              echo "Generating debug.keystore in $pdir"
              keytool -genkey -v -keystore "$pdir/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          done

          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore "debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          # Find directory containing settings.gradle.kts (handles root or nested folders)
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -not -path "*/build/*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Building project in directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseManager-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 14
