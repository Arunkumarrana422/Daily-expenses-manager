name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure google-services.json exists
        run: |
          find . -name "app" -type d | while read appdir; do
            if [ ! -f "$appdir/google-services.json" ]; then
              echo "Creating fallback google-services.json in $appdir"
              cat << 'EOF' > "$appdir/google-services.json"
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "expense-manager-app",
              "storage_bucket": "expense-manager-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.expensemanager.dxpvrt"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildVerification12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          done

      - name: Ensure Debug Keystore exists
        run: |
          # 1. Decode debug.keystore.base64 if present
          find . -name "debug.keystore.base64" | while read kfile; do
            kdir=$(dirname "$kfile")
            base64 -d "$kfile" > "$kdir/debug.keystore" || true
          done

          # 2. Automatically generate debug.keystore if missing
          find . -name "settings.gradle.kts" -not -path "*/build/*" | while read sfile; do
            pdir=$(dirname "$sfile")
            if [ ! -f "$pdir/debug.keystore" ]; then
              echo "Generating debug.keystore in $pdir"
              keytool -genkey -v -keystore "$pdir/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          done

          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore "debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -not -path "*/build/*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Building project in: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyExpenseManager-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 14
